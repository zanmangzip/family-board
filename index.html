* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100dvh;
  background-color: var(--bg);
  background-image:
    radial-gradient(circle at 10% 12%, #FFE9D6 0%, transparent 28%),
    radial-gradient(circle at 92% 88%, #E3F6FF 0%, transparent 32%);
  color: var(--text);
  font-family: 'Gowun Dodum', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
  overflow: hidden;
}

.dashboard {
  display: grid;
  grid-template-columns: 44% 1fr;
  gap: 22px;
  width: 100%;
  height: 100dvh;
  padding: max(20px, env(safe-area-inset-top)) max(22px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(22px, env(safe-area-inset-left));
}

/* 왼쪽 영역: 시계 + 날씨 */
.left-col {
  display: flex;
  flex-direction: column;
  gap: 20px;
  min-height: 0;
}

.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 24px 26px;
  border: 3px solid #FFF2E6;
}

/* 시계 카드 */
.clock-card {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  flex: 0 0 auto;
  background: linear-gradient(180deg, #FFFFFF 0%, #FFFBF5 100%);
}

.date-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: 'Jua', sans-serif;
  font-size: clamp(1.5rem, 2.5vw, 2.2rem);
  color: var(--text);
  margin-bottom: 6px;
}

.weekday-badge {
  padding: 4px 16px;
  border-radius: 999px;
  background: var(--yellow-soft);
  color: #C97A00;
  font-size: 0.9em;
}
.weekday-badge.sat { background: #E3F2FD; color: #1976D2; }
.weekday-badge.sun { background: #FFEBEE; color: #E53935; }

.time-row {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 12px;
  line-height: 1;
  margin: 6px 0;
}

.ampm {
  font-family: 'Jua', sans-serif;
  font-size: clamp(1.6rem, 2.6vw, 2.4rem);
  color: var(--primary);
}

.time-digits {
  font-family: 'Jua', sans-serif;
  font-size: clamp(4.2rem, 7.6vw, 6.8rem);
  letter-spacing: 2px;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

.colon {
  display: inline-block;
  animation: blink 2s infinite;
}
@keyframes blink {
  0%, 49%, 100% { opacity: 1; }
  50%, 99% { opacity: 0.3; }
}

.status-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 8px;
  font-size: 0.95rem;
  color: var(--text-sub);
}

.wake-pill {
  background: var(--mint-soft);
  color: #1D8A82;
  padding: 4px 12px;
  border-radius: 999px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  font-family: inherit;
  font-size: 0.9rem;
}
.wake-pill.off {
  background: #F3ECE6;
  color: var(--text-sub);
}

/* 날씨 카드 */
.weather-card {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 0;
  border-color: #E3F3FF;
  background: linear-gradient(180deg, #FFFFFF 0%, #F7FBFF 100%);
  cursor: pointer;
}

.weather-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.location-tag {
  font-family: 'Jua', sans-serif;
  font-size: clamp(1.25rem, 1.9vw, 1.65rem);
  color: #2B7BBB;
  display: flex;
  align-items: center;
  gap: 6px;
}

.weather-updated {
  font-size: 0.9rem;
  color: var(--text-sub);
}

.weather-today {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 8px 4px;
}

.weather-main-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.weather-emoji {
  font-size: clamp(3.6rem, 6vw, 5.2rem);
  line-height: 1;
  filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.08));
}

.temp-now {
  font-family: 'Jua', sans-serif;
  font-size: clamp(3rem, 5vw, 4.4rem);
  line-height: 1;
  color: var(--text);
}

.weather-desc {
  font-family: 'Jua', sans-serif;
  font-size: clamp(1.2rem, 1.8vw, 1.55rem);
  color: #3B82C4;
  margin-top: 4px;
}

.weather-meta {
  text-align: right;
  font-size: clamp(1rem, 1.45vw, 1.25rem);
  line-height: 1.55;
  color: var(--text);
  font-weight: 700;
}

.temp-minmax .hi { color: #EF5350; }
.temp-minmax .lo { color: #42A5F5; }

.weather-tip {
  background: var(--yellow-soft);
  color: #9A5D00;
  border-radius: 16px;
  padding: 10px 14px;
  font-family: 'Jua', sans-serif;
  font-size: clamp(1.05rem, 1.5vw, 1.3rem);
  text-align: center;
}

.weather-tomorrow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--sky-soft);
  border-radius: 18px;
  padding: 12px 18px;
  font-size: clamp(1.05rem, 1.5vw, 1.35rem);
}

.tomorrow-left {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: 'Jua', sans-serif;
}

.tomorrow-badge {
  background: #FFFFFF;
  color: #2B7BBB;
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 0.9em;
}

/* 오른쪽 영역: 가족 할 일 목록 */
.todo-card {
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-color: #FFE7DC;
}

.todo-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}

.todo-title {
  font-family: 'Jua', sans-serif;
  font-size: clamp(1.7rem, 2.6vw, 2.3rem);
  color: var(--text);
  margin: 0;
  display: flex;
  align-items: center;
  gap: 10px;
}

.edit-btn {
  background: var(--primary-soft);
  color: #D85A34;
  border: none;
  border-radius: 999px;
  padding: 8px 16px;
  font-family: 'Jua', sans-serif;
  font-size: 1.05rem;
  cursor: pointer;
}

.progress-wrap {
  margin-bottom: 16px;
}

.progress-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: 'Jua', sans-serif;
  font-size: clamp(1.05rem, 1.5vw, 1.3rem);
  color: var(--text-sub);
  margin-bottom: 8px;
}

.progress-bar-bg {
  width: 100%;
  height: 18px;
  background: #F4ECE4;
  border-radius: 999px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #FFB74D, #FF8A65, #4ECDC4);
  border-radius: 999px;
  transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}

.todo-list {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-right: 4px;
}

.todo-item {
  display: flex;
  align-items: center;
  gap: 16px;
  background: #FFFBF7;
  border: 3px solid #F6E5D6;
  border-radius: 22px;
  padding: 16px 20px;
  cursor: pointer;
  transition: transform 0.12s ease, background-color 0.2s ease, border-color 0.2s ease;
}

.todo-item:active {
  transform: scale(0.98);
}

.todo-item.done {
  background: var(--mint-soft);
  border-color: #9EE5DF;
}

.check-circle {
  flex: 0 0 auto;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 4px solid #FFB396;
  background: #FFFFFF;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.6rem;
  color: #FFFFFF;
  transition: all 0.2s ease;
}

.todo-item.done .check-circle {
  background: var(--mint);
  border-color: var(--mint);
}

.todo-text {
  font-family: 'Jua', sans-serif;
  font-size: clamp(1.35rem, 2.2vw, 1.9rem);
  color: var(--text);
  line-height: 1.25;
  flex: 1;
}

.todo-item.done .todo-text {
  text-decoration: line-through;
  color: #5E8C88;
}

.delete-task-btn {
  display: none;
  background: #FFE5E5;
  color: #D94343;
  border: none;
  border-radius: 12px;
  padding: 8px 14px;
  font-family: 'Jua', sans-serif;
  font-size: 1.05rem;
  cursor: pointer;
}

.editing .delete-task-btn {
  display: inline-block;
}

.add-task-row {
  display: none;
  gap: 10px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 2px dashed #F0DFD0;
}

.editing .add-task-row {
  display: flex;
}

.add-task-input {
  flex: 1;
  border: 3px solid #FFD3C2;
  border-radius: 16px;
  padding: 12px 16px;
  font-family: 'Gowun Dodum', sans-serif;
  font-size: 1.2rem;
  outline: none;
}

.add-task-btn {
  background: var(--primary);
  color: #FFFFFF;
  border: none;
  border-radius: 16px;
  padding: 0 22px;
  font-family: 'Jua', sans-serif;
  font-size: 1.25rem;
  cursor: pointer;
}

/* 야간 모드 (22:00 ~ 07:00) 까만 화면 */
.night-overlay {
  position: fixed;
  inset: 0;
  background: #000000;
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.night-overlay.active {
  display: flex;
}

/* 야간 중 잠깐 보기 안내 바 */
.peek-banner {
  position: fixed;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(30, 30, 30, 0.85);
  color: #FFFFFF;
  padding: 8px 18px;
  border-radius: 999px;
  font-size: 0.95rem;
  z-index: 9998;
  display: none;
}

.peek-banner.active {
  display: block;
}

/* 세로 화면이나 작은 화면 대응 */
@media (max-width: 820px) {
  html, body { height: auto; overflow-y: auto; }
  .dashboard { grid-template-columns: 1fr; height: auto; }
}

/* ========================
   2. 시계 · 날짜 · 야간 모드
======================== */
const WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
let peekUntil = 0;

// 아침 7시를 기준으로 하루가 바뀌도록 날짜 키 계산
function getMorningDayKey(now = new Date()) {
  const shifted = new Date(now.getTime());
  if (shifted.getHours() < NIGHT_END_HOUR) {
    shifted.setDate(shifted.getDate() - 1);
  }
  const y = shifted.getFullYear();
  const m = String(shifted.getMonth() + 1).padStart(2, '0');
  const d = String(shifted.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function updateClockAndNightMode() {
  const now = new Date();
  const month = now.getMonth() + 1;
  const date = now.getDate();
  const dayIdx = now.getDay();
  const hour24 = now.getHours();
  const min = String(now.getMinutes()).padStart(2, '0');

  const isPM = hour24 >= 12;
  const hour12 = hour24 % 12 === 0 ? 12 : hour24 % 12;

  document.getElementById('dateText').textContent = `${month}월 ${date}일`;
  const badge = document.getElementById('weekdayBadge');
  badge.textContent = WEEKDAYS[dayIdx];
  badge.className = 'weekday-badge' + (dayIdx === 6 ? ' sat' : dayIdx === 0 ? ' sun' : '');

  document.getElementById('ampmText').textContent = isPM ? '오후' : '오전';
  document.getElementById('hourText').textContent = String(hour12).padStart(2, '0');
  document.getElementById('minText').textContent = min;

  // 다음 날 아침(7시) 자동 초기화 체크
  checkMorningReset(now);

  // 밤 10시 ~ 아침 7시 까만 화면 처리
  const isNight = hour24 >= NIGHT_START_HOUR || hour24 < NIGHT_END_HOUR;
  const overlay = document.getElementById('nightOverlay');
  const peekBanner = document.getElementById('peekBanner');
  const isPeeking = Date.now() < peekUntil;

  if (isNight && !isPeeking) {
    overlay.classList.add('active');
    peekBanner.classList.remove('active');
  } else {
    overlay.classList.remove('active');
    peekBanner.classList.toggle('active', isNight && isPeeking);
  }
}

// 밤에 화면을 한 번 누르면 15초간 잠깐 확인 가능
document.getElementById('nightOverlay').addEventListener('click', () => {
  peekUntil = Date.now() + 15000;
  updateClockAndNightMode();
});

/* ========================

function mapWeatherCode(code) {
  if (code === 0) return { emoji: '☀️', label: '맑음' };
  if (code <= 2) return { emoji: '🌤️', label: '구름 조금' };
  if (code === 3) return { emoji: '☁️', label: '흐림' };
  if (code === 45 || code === 48) return { emoji: '🌫️', label: '안개' };
  if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return { emoji: '🌧️', label: '비' };
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return { emoji: '❄️', label: '눈' };
  if (code >= 95) return { emoji: '⛈️', label: '천둥번개' };
  return { emoji: '🌤️', label: '보통' };
}

function getKidTip(temp, rainProb, code) {
  if (rainProb >= 50 || (code >= 51 && code <= 67) || (code >= 80 && code <= 82)) {
    return '☔ 비가 올 수 있어요! 우산을 꼭 챙겨요';
  }
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) {
    return '🧤 눈이 와요! 미끄러지지 않게 조심해요';
  }
  if (temp <= 5) return '🧥 날씨가 많이 추워요! 두꺼운 겉옷 필수';
  if (temp <= 15) return '🧶 선선해요! 가벼운 겉옷을 챙겨 입어요';
  if (temp >= 28) return '🧢 많이 더워요! 물 자주 마시고 시원하게 입어요';
  return '😊 놀기 좋은 날씨예요! 오늘도 즐거운 하루';
}

async function fetchWeather() {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${SUJI_LAT}&longitude=${SUJI_LON}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&forecast_days=2`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    const curTemp = Math.round(data.current.temperature_2m);
    const curInfo = mapWeatherCode(data.current.weather_code);
    const todayMax = Math.round(data.daily.temperature_2m_max[0]);
    const todayMin = Math.round(data.daily.temperature_2m_min[0]);
    const todayRain = data.daily.precipitation_probability_max[0] ?? 0;

    const tomInfo = mapWeatherCode(data.daily.weather_code[1]);
    const tomMax = Math.round(data.daily.temperature_2m_max[1]);
    const tomMin = Math.round(data.daily.temperature_2m_min[1]);
    const tomRain = data.daily.precipitation_probability_max[1] ?? 0;

    document.getElementById('todayEmoji').textContent = curInfo.emoji;
    document.getElementById('todayTemp').textContent = `${curTemp}°`;
    document.getElementById('todayDesc').textContent = curInfo.label;
    document.getElementById('todayMax').textContent = `최고 ${todayMax}°`;
    document.getElementById('todayMin').textContent = `최저 ${todayMin}°`;
    document.getElementById('todayRain').textContent = `☔ 비 확률 ${todayRain}%`;
    document.getElementById('weatherTip').textContent = getKidTip(curTemp, todayRain, data.current.weather_code);

    document.getElementById('tomorrowEmoji').textContent = tomInfo.emoji;
    document.getElementById('tomorrowDesc').textContent = tomInfo.label;
    document.getElementById('tomorrowMax').textContent = `${tomMax}°`;
    document.getElementById('tomorrowMin').textContent = `${tomMin}°`;
    document.getElementById('tomorrowRain').textContent = `☔ ${tomRain}%`;

    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('weatherUpdated').textContent = `${hh}:${mm} 기준`;
  } catch (err) {
    document.getElementById('weatherUpdated').textContent = '연결 확인 필요 (탭해서 재시도)';
  }
}

document.getElementById('weatherCard').addEventListener('click', fetchWeather);

/* ========================
   4. 가족 할 일 목록 (로컬 저장 + 아침 자동 초기화)
======================== */
let tasks = [];
let checkedMap = {};
let isEditing = false;

function loadTasks() {
  try {
    const savedTasks = JSON.parse(localStorage.getItem(STORAGE_KEYS.tasks));
    tasks = Array.isArray(savedTasks) && savedTasks.length > 0 ? savedTasks : [...DEFAULT_TASKS];
  } catch {
    tasks = [...DEFAULT_TASKS];
  }

  const todayKey = getMorningDayKey();
  const savedDayKey = localStorage.getItem(STORAGE_KEYS.dayKey);

  if (savedDayKey !== todayKey) {
    checkedMap = {};
    localStorage.setItem(STORAGE_KEYS.dayKey, todayKey);
    localStorage.setItem(STORAGE_KEYS.checked, JSON.stringify(checkedMap));
  } else {
    try {
      checkedMap = JSON.parse(localStorage.getItem(STORAGE_KEYS.checked)) || {};
    } catch {
      checkedMap = {};
    }
  }
}

function checkMorningReset(now) {
  const currentKey = getMorningDayKey(now);
  const savedKey = localStorage.getItem(STORAGE_KEYS.dayKey);
  if (savedKey && savedKey !== currentKey) {
    checkedMap = {};
    localStorage.setItem(STORAGE_KEYS.dayKey, currentKey);
    localStorage.setItem(STORAGE_KEYS.checked, JSON.stringify(checkedMap));
    renderTasks();
  }
}

function saveTasks() {
  localStorage.setItem(STORAGE_KEYS.tasks, JSON.stringify(tasks));
  localStorage.setItem(STORAGE_KEYS.checked, JSON.stringify(checkedMap));
  localStorage.setItem(STORAGE_KEYS.dayKey, getMorningDayKey());
}

function renderTasks() {
  const listEl = document.getElementById('todoList');
  listEl.innerHTML = '';

  let doneCount = 0;

  tasks.forEach((task) => {
    const isDone = Boolean(checkedMap[task.id]);
    if (isDone) doneCount++;

    const item = document.createElement('div');
    item.className = 'todo-item' + (isDone ? ' done' : '');

    const circle = document.createElement('div');
    circle.className = 'check-circle';
    circle.textContent = isDone ? '✓' : '';

    const text = document.createElement('div');
    text.className = 'todo-text';
    text.textContent = task.text;

    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'delete-task-btn';
    delBtn.textContent = '삭제';
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      tasks = tasks.filter((t) => t.id !== task.id);
      delete checkedMap[task.id];
      saveTasks();
      renderTasks();
    });

    item.addEventListener('click', () => {
      if (isEditing) return;
      checkedMap[task.id] = !checkedMap[task.id];
      saveTasks();
      renderTasks();
    });

    item.append(circle, text, delBtn);
    listEl.appendChild(item);
  });

  const total = tasks.length;
  const percent = total === 0 ? 0 : Math.round((doneCount / total) * 100);
  document.getElementById('progressFill').style.width = `${percent}%`;
  document.getElementById('progressCount').textContent = `${doneCount} / ${total}`;

  const msgEl = document.getElementById('progressMsg');
  if (total > 0 && doneCount === total) {
    msgEl.textContent = '🎉 모두 완료! 우리 가족 최고예요!';
  } else if (doneCount > 0) {
    msgEl.textContent = `🌟 잘하고 있어요! ${total - doneCount}개 남았어요`;
  } else {
    msgEl.textContent = '✨ 오늘 할 일을 하나씩 눌러서 체크해요';
  }
}

document.getElementById('editToggleBtn').addEventListener('click', () => {
  isEditing = !isEditing;
  document.getElementById('todoCard').classList.toggle('editing', isEditing);
  document.getElementById('editToggleBtn').textContent = isEditing ? '✅ 완료' : '✏️ 편집';
});

document.getElementById('addTaskForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const input = document.getElementById('newTaskInput');
  const text = input.value.trim();
  if (!text) return;
  tasks.push({ id: 't_' + Date.now(), text });
  input.value = '';
  saveTasks();
  renderTasks();
});

/* ========================
   5. 화면 꺼짐 방지 (Wake Lock)
======================== */
let wakeLock = null;
const wakeBtn = document.getElementById('wakeBtn');

function updateWakeUI(active, unsupported = false) {
  if (unsupported) {
    wakeBtn.textContent = '⚠️ 브라우저 화면 유지 미지원';
    wakeBtn.classList.add('off');
    return;
  }
  if (active) {
    wakeBtn.textContent = '☀️ 화면 켜짐 유지 중';
    wakeBtn.classList.remove('off');
  } else {
    wakeBtn.textContent = '💤 탭해서 화면 켜짐 유지';
    wakeBtn.classList.add('off');
  }
}

async function requestWakeLock() {
  if (!('wakeLock' in navigator)) {
    updateWakeUI(false, true);
    return;
  }
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    updateWakeUI(true);
    wakeLock.addEventListener('release', () => {
      updateWakeUI(false);
    });
  } catch {
    updateWakeUI(false);
  }
}

wakeBtn.addEventListener('click', requestWakeLock);

// 화면에 다시 돌아오면 Wake Lock 재요청
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    requestWakeLock();
    updateClockAndNightMode();
  }
});

// 첫 터치 시 자동 재시도 (브라우저 정책 대응)
document.addEventListener('pointerdown', () => {
  if (!wakeLock) requestWakeLock();
}, { once: true });

/* ========================
   6. 초기 실행
======================== */
loadTasks();
renderTasks();
updateClockAndNightMode();
fetchWeather();
requestWakeLock();

setInterval(updateClockAndNightMode, 1000);
setInterval(fetchWeather, 30 * 60 * 1000); // 30분마다 날씨 갱신
